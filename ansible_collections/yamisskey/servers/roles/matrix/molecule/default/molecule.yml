---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: matrix-test-instance
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /run
    capabilities:
      - SYS_ADMIN
    command: bash -c "mkdir -p /tmp/.ansible-tmp && chmod 1777 /tmp/.ansible-tmp && chown root:root /tmp/.ansible-tmp && touch /tmp/.ansible-tmp/.ansible-test && while true; do sleep 30; done"
    networks:
      - name: molecule-test-network
provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: profile_tasks,timer
      remote_tmp: /tmp/.ansible-tmp
      roles_path: ../../../
  env:
    ANSIBLE_REMOTE_TMP: /tmp/.ansible-tmp
  inventory:
    host_vars:
      matrix-test-instance:
        # Role-specific test configuration will be added here
        ansible_user: "root"
        domain: "example.com"
        turn_server_name: "turn.example.com"
        livekit_jwt_server_name: "livekit-jwt.example.com"
        synapse:
          registration_shared_secret: reg-secret
          macaroon_secret_key: macaroon-secret
          form_secret: form-secret
          postgresql:
            user: synapse
            password: synapse-pass
            database: synapse
            host: localhost
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
