---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: openclaw-test-instance
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /run
    capabilities:
      - SYS_ADMIN
    command: bash -c "mkdir -p /tmp/.ansible-tmp && chmod 1777 /tmp/.ansible-tmp && chown root:root /tmp/.ansible-tmp && touch /tmp/.ansible-tmp/.ansible-test && while true; do sleep 30; done"
    networks:
      - name: molecule-test-network
provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: profile_tasks,timer
      remote_tmp: /tmp/.ansible-tmp
      roles_path: ../../../
  env:
    ANSIBLE_REMOTE_TMP: /tmp/.ansible-tmp
  inventory:
    host_vars:
      openclaw-test-instance:
        ansible_user: "root"
        # Mock secrets required by tasks/main.yml assertions
        openclaw:
          gateway_token: "test-gateway-token"
          kimi_api_key: "test-kimi-key"
          anthropic_api_key: "test-anthropic-key"
          openai_api_key: "test-openai-key"
          discord_webhook_url: "https://discord.com/api/webhooks/test"
          discord_bot_token: "test-discord-token"
          matrix_password: "test-matrix-password"
        # Required by vars/main.yml
        host_services:
          openclaw-test-instance:
            openclaw_gateway: 18789
            openclaw_bridge: 18790
          balthasar:
            synapse: 8008
        domain: "test.example.com"
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - converge
    - verify
    - cleanup
    - destroy
