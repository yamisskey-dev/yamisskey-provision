---
- name: Install development tools for OpenClaw agent
  ansible.builtin.apt:
    name:
      # VCS
      - git
      # Languages & runtimes
      - python3
      - python3-pip
      - python3-venv
      # Build tools
      - build-essential
      - cmake
      # Network tools
      - curl
      - wget
      - openssh-client
      # Utilities
      - jq
      - unzip
      - rsync
    state: present
    update_cache: true
  become: true

- name: Install Node.js via NodeSource
  block:
    - name: Check if Node.js is installed
      command: node --version
      register: node_check
      changed_when: false
      failed_when: false

    - name: Download NodeSource setup script
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/setup_{{ openclaw_node_version | default('22') }}.x
        dest: /tmp/nodesource_setup.sh
        mode: '0755'
      when: node_check.rc != 0

    - name: Run NodeSource setup
      command: bash /tmp/nodesource_setup.sh
      become: true
      when: node_check.rc != 0

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
      become: true
      when: node_check.rc != 0

    - name: Clean up setup script
      file:
        path: /tmp/nodesource_setup.sh
        state: absent
