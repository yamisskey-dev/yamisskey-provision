---
- name: Gather OpenClaw secrets from inventory
  set_fact:
    openclaw_inventory_secrets: "{{ hostvars[inventory_hostname].openclaw | default({}) }}"

- name: Ensure required OpenClaw secrets are provided
  assert:
    that:
      - openclaw_inventory_secrets | length > 0
      - openclaw_inventory_secrets.gateway_token is defined
      - openclaw_inventory_secrets.openrouter_api_key is defined
      - openclaw_inventory_secrets.anthropic_api_key is defined
      - openclaw_inventory_secrets.openai_api_key is defined
      - openclaw_inventory_secrets.telegram_bot_token is defined
    fail_msg: >-
      Missing OpenClaw secrets for host {{ inventory_hostname }}. Define the values under
      "openclaw" in deploy/servers/host_vars/{{ inventory_hostname }}/secrets.yml.
    success_msg: "Validated OpenClaw secrets from host_vars."

- name: Apply OpenClaw secrets to role variables
  set_fact:
    openclaw_gateway_token: "{{ openclaw_inventory_secrets.gateway_token }}"
    openclaw_openrouter_api_key: "{{ openclaw_inventory_secrets.openrouter_api_key }}"
    openclaw_anthropic_api_key: "{{ openclaw_inventory_secrets.anthropic_api_key }}"
    openclaw_openai_api_key: "{{ openclaw_inventory_secrets.openai_api_key }}"
    openclaw_telegram_bot_token: "{{ openclaw_inventory_secrets.telegram_bot_token }}"
    openclaw_brave_api_key: "{{ openclaw_inventory_secrets.brave_api_key | default('') }}"
    openclaw_misskey_token: "{{ openclaw_inventory_secrets.misskey_token | default('') }}"
    openclaw_misskey_beta_token: "{{ openclaw_inventory_secrets.misskey_beta_token | default('') }}"

- name: Install development tools
  include_tasks: devtools.yml
  tags: [devtools]

- name: Get Docker group GID
  command: getent group docker
  register: docker_group_result
  changed_when: false

- name: Set Docker GID fact
  set_fact:
    openclaw_docker_gid: "{{ docker_group_result.stdout.split(':')[2] }}"

- name: Create OpenClaw directories
  file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  loop:
    - { path: "{{ openclaw_dir }}", mode: '0755' }
    - { path: "{{ openclaw_home }}", mode: '0700' }
    - { path: "{{ openclaw_home }}/workspace", mode: '0755' }

- name: Configure OpenClaw environment
  template:
    src: openclaw.env-docker-compose.j2
    dest: "{{ openclaw_dir }}/.env-docker-compose"
    mode: '0600'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  register: openclaw_env_result

- name: Deploy Dockerfile
  template:
    src: openclaw.Dockerfile.j2
    dest: "{{ openclaw_dir }}/Dockerfile"
    mode: '0644'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  register: openclaw_dockerfile_result

- name: Copy docker-compose configuration
  template:
    src: openclaw_docker-compose.yml.j2
    dest: "{{ openclaw_dir }}/docker-compose.yml"
    mode: '0644'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  register: openclaw_compose_config_result

- name: Deploy sandbox Dockerfile
  template:
    src: openclaw-sandbox.Dockerfile.j2
    dest: "{{ openclaw_dir }}/Dockerfile.sandbox"
    mode: '0644'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  register: openclaw_sandbox_dockerfile_result

- name: Build sandbox image
  community.docker.docker_image:
    name: "{{ openclaw_sandbox_image_name | default('openclaw-sandbox') }}"
    tag: latest
    source: build
    build:
      path: "{{ openclaw_dir }}"
      dockerfile: Dockerfile.sandbox
    force_source: "{{ openclaw_sandbox_dockerfile_result.changed | default(false) }}"
  become: true

- name: Install clawhub CLI
  community.general.npm:
    name: clawhub
    global: true
    state: present
  become: true

- name: Create OpenClaw skills directory
  file:
    path: "{{ openclaw_home }}/skills"
    state: directory
    mode: '0755'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Install OpenClaw skills
  command:
    cmd: clawhub install {{ item }}
    chdir: "{{ openclaw_home }}"
  loop: "{{ openclaw_skills | default([]) }}"
  register: openclaw_skill_result
  changed_when: "'installed' in openclaw_skill_result.stdout"

- name: Deploy OpenClaw configuration
  template:
    src: openclaw.json.j2
    dest: "{{ openclaw_home }}/openclaw.json"
    mode: '0600'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  register: openclaw_config_result

- name: Set Tailscale operator for non-root access
  ansible.builtin.command:
    cmd: tailscale set --operator={{ ansible_user }}
  register: tailscale_operator_result
  changed_when: tailscale_operator_result.rc == 0
  failed_when: false

- name: Build OpenClaw image
  community.docker.docker_compose_v2:
    project_src: "{{ openclaw_dir }}"
    build: always
    state: present
    recreate: never
  failed_when: false
  register: openclaw_compose_result
  changed_when: false

- name: Recreate OpenClaw if configuration changed
  community.docker.docker_compose_v2:
    project_src: "{{ openclaw_dir }}"
    state: present
    recreate: always
  when: (openclaw_config_result.changed | default(false)) or (openclaw_env_result.changed | default(false)) or (openclaw_compose_config_result.changed | default(false)) or (openclaw_dockerfile_result.changed | default(false))
  failed_when: false

- name: Expose OpenClaw via Tailscale Serve (HTTPS fallback)
  ansible.builtin.command:
    cmd: tailscale serve --bg --https={{ openclaw_tailscale_https_port | default(443) }} http://127.0.0.1:{{ openclaw_gateway_port }}
  register: tailscale_serve_result
  changed_when: "'started' in tailscale_serve_result.stdout or 'already' not in tailscale_serve_result.stderr"
  failed_when: false
  when: openclaw_compose_result is failed
