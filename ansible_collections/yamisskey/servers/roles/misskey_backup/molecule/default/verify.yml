---
- name: Verify misskey-backup deployment
  hosts: all
  gather_facts: false

  tasks:
    - name: Check backup directories exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: backup_dirs
      loop:
        - /opt/backups/misskey
        - /opt/misskey-backup
        - /opt/misskey-backup/backups

    - name: Assert directories exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
      loop: "{{ backup_dirs.results }}"

    - name: Display verification summary
      debug:
        msg: |
          misskey-backup Role Verification Summary:
          ====================================
          Backup base directory: OK
          Misskey backup directory: OK
          Backups subdirectory: OK
