---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  # molecule コンテナは PID1 が bash のため systemd 操作をスキップ
  when: ansible_service_mgr == 'systemd'

- name: Enable db-backup timer
  ansible.builtin.systemd:
    name: db-backup.timer
    enabled: true
    state: started
  become: true
  when: ansible_service_mgr == 'systemd'
