- name: Restart Cloudflared
  systemd:
    name: cloudflared
    state: restarted

- name: Restart Docker
  systemd:
    name: docker
    state: restarted
  become: true

- name: Restart Misskey web
  command: '{{ docker_compose_cmd }} restart web'
  args:
    chdir: '{{ misskey_dir }}'
  when: not ansible_check_mode
