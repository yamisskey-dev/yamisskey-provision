---
- name: Check if directory exists
  ansible.builtin.stat:
    path: '{{ misskey_dir }}'
  register: dir_check

- name: Ensure Misskey directory exists
  file:
    path: '{{ misskey_dir }}'
    state: directory
    owner: "{{ ansible_user | default('root') }}"
    group: "{{ ansible_user | default('root') }}"
    mode: '0755'

- name: Create required directories
  file:
    path: '{{ item }}'
    state: directory
    mode: '0755'
  loop:
    - '{{ misskey_dir }}/.config'
    - '{{ misskey_dir }}/files'
    - '{{ misskey_dir }}/redis'
    - '{{ misskey_dir }}/db'

- name: Check if required files exist
  ansible.builtin.stat:
    path: '{{ item }}'
  loop:
    - '{{ misskey_dir }}/docker-compose.yml'
    - '{{ misskey_dir }}/.config/default.yml'
    - '{{ misskey_dir }}/.config/docker.env'
  register: required_files

- name: Deploy docker-compose.yml
  template:
    src: misskey_docker-compose.yml.j2
    dest: '{{ misskey_dir }}/docker-compose.yml'
    mode: '0644'
  when: not required_files.results[0].stat.exists

- name: Deploy default.yml from template
  template:
    src: docker_example.yml.j2
    dest: '{{ misskey_dir }}/.config/default.yml'
    mode: '0644'
  when: not required_files.results[1].stat.exists

- name: Deploy docker.env from template
  template:
    src: docker_example.env.j2
    dest: '{{ misskey_dir }}/.config/docker.env'
    mode: '0644'
  when: not required_files.results[2].stat.exists

- name: Recheck if required files exist
  ansible.builtin.stat:
    path: '{{ item }}'
  loop:
    - '{{ misskey_dir }}/docker-compose.yml'
    - '{{ misskey_dir }}/.config/default.yml'
    - '{{ misskey_dir }}/.config/docker.env'
  register: final_check

- name: Fail if required files are still missing
  fail:
    msg: 'Required file {{ item.item }} not found'
  when:
    - not item.stat.exists
    - not ansible_check_mode
  loop: '{{ final_check.results }}'

- name: Deploy postgresql.conf
  template:
    src: misskey_postgresql.conf.j2
    dest: '{{ misskey_dir }}/.config/postgresql.conf'
    mode: '0644'

- name: Check if database is initialized
  ansible.builtin.stat:
    path: '{{ misskey_dir }}/db/PG_VERSION'
  register: db_initialized

- name: Stop existing containers before first initialization
  command: '{{ docker_compose_cmd }} down'
  args:
    chdir: '{{ misskey_dir }}'
  when:
    - not db_initialized.stat.exists
    - not ansible_check_mode

- name: Initialize database (first time only)
  command: '{{ docker_compose_cmd }} run --rm web pnpm run init'
  args:
    chdir: '{{ misskey_dir }}'
  when:
    - not db_initialized.stat.exists
    - not ansible_check_mode
  register: init_output
  failed_when: init_output.rc != 0

- name: Determine if updates are needed
  set_fact:
    updates_needed: "{{ (git_pull_output.stdout | default('Already up to date.')) != 'Already up to date.' or (git_submodule_update_output.stdout | default('')) != '' }}"

- name: Stop Misskey services
  command: '{{ docker_compose_cmd }} stop'
  args:
    chdir: '{{ misskey_dir }}'
  when:
    - updates_needed or not db_initialized.stat.exists
    - not ansible_check_mode

- name: Start Misskey
  command: '{{ docker_compose_cmd }} up -d'
  args:
    chdir: '{{ misskey_dir }}'
  when: not ansible_check_mode
  register: start_output
  failed_when: start_output.rc != 0

- name: Change permissions of files directory
  file:
    path: '{{ misskey_dir }}/files'
    state: directory
    mode: '0777'
  when: not ansible_check_mode

- name: Ensure backup directory exists
  file:
    path: '{{ backup_dir }}/misskey'
    state: directory
    owner: '{{ ansible_user }}'
    group: '{{ ansible_user }}'
    mode: '0755'
  when: not ansible_check_mode

- name: Check existing VAPID public key in Misskey meta table
  shell: |
    {{ docker_compose_cmd }} exec -T db sh -c \
      'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT \"swPublicKey\" FROM meta;"'
  args:
    chdir: '{{ misskey_dir }}'
  register: vapid_db_check
  changed_when: false
  when: not ansible_check_mode

- name: Generate new VAPID keys (only if DB has none)
  command: >
    {{ docker_compose_cmd }} exec -T web
    node -e "console.log(JSON.stringify(require('web-push').generateVAPIDKeys()))"
  args:
    chdir: '{{ misskey_dir }}'
  register: vapid_gen
  no_log: true
  when:
    - not ansible_check_mode
    - vapid_db_check.stdout | default('') | trim == ''

- name: Apply generated VAPID keys to Misskey meta table
  shell: |
    {{ docker_compose_cmd }} exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
    UPDATE meta SET
      "swPublicKey" = '{{ (vapid_gen.stdout | from_json).publicKey }}',
      "swPrivateKey" = '{{ (vapid_gen.stdout | from_json).privateKey }}',
      "enableServiceWorker" = true;
    SQL
  args:
    chdir: '{{ misskey_dir }}'
  no_log: true
  when:
    - not ansible_check_mode
    - vapid_db_check.stdout | default('') | trim == ''
