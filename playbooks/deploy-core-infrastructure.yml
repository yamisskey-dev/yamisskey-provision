---
- name: Deploy Core Infrastructure Stack
  hosts: all
  become: true
  gather_facts: true

  vars:
    ansible_python_interpreter: /usr/bin/python3

  roles:
    - role: yamisskey.servers.common
      tags: [common, base]

    - role: yamisskey.servers.security
      tags: [security, hardening]

    - role: yamisskey.servers.garage
      tags: [garage, storage]
      when: "'storage' in group_names or inventory_hostname in groups.get('garage', [])"

  post_tasks:
    - name: Display deployment summary
      ansible.builtin.debug:
        msg: "Core Infrastructure Deployment Complete (common + security + garage)"
