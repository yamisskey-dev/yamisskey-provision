---
# Caspar - Security & monitoring hub + Beta Misskey

# Cloudflared tunnel configuration
cloudflared_tunnel_uuid: "{{ caspar_cloudflared_tunnel_uuid }}"
cloudflared_config_dir: "/root/.cloudflared"
# Docker ブリッジ経由で Prometheus (host.docker.internal) から metrics を scrape させる。
# 0.0.0.0 にすると /debug/pprof まで外部公開されるため docker0 のみに限定する。
cloudflared_metrics_bind: "172.17.0.1"

# Service-specific configurations
modsecurity_nginx_port: "{{ host_services.caspar.modsecurity_nginx }}"
prometheus_port: "{{ host_services.caspar.prometheus }}"
grafana_port: "{{ host_services.caspar.grafana }}"

# Misskey Beta configuration
misskey_port: "{{ host_services.caspar.misskey_beta }}"
misskey_host: "beta.{{ domain }}"
misskey_tag: "staging"

# Yamix AI backend (OpenRouter)
yamix_openai_base_url: "https://openrouter.ai/api/v1"
yamix_openai_model: "deepseek/deepseek-v4-pro-0813"

# Nginx services to deploy (monitoring + beta misskey + yamix)
modsecurity_nginx_services:
  - "grafana"
  - "uptime"
  - "misskey_beta"
  # AI Life Counseling service
  - "yamix"

# Prometheus monitoring targets
monitor_targets:
  - name: caspar
    host: "host.docker.internal"
    port: 9100
    cadvisor_port: 8085
    role: monitoring_server
  - name: balthasar
    host: "{{ hostvars['balthasar']['ansible_host'] }}"
    port: 9100
    cadvisor_port: 8085
    role: social_server
  - name: linode_prox
    host: "{{ hostvars['linode_prox']['ansible_host'] }}"
    port: 9100
    cadvisor_port: 8085
    role: proxy_server
  - name: raspberrypi
    host: "{{ hostvars['raspberrypi']['ansible_host'] }}"
    port: 9100
    cadvisor_port: 8085
    role: game_server
