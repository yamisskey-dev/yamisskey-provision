---
# melchior - Password manager host (Vaultwarden) - Arch Linux
# Secrets (host_vars/melchior/secrets.sops.yml):
#   vaultwarden.admin_token   - Vaultwarden /admin token
#   cloudflared_tunnel_uuid   - existing tunnel (created manually with `cloudflared tunnel create`)
#   hermes.env_file           - ~/.hermes/.env の内容そのまま（API キー、Telegram トークン等）
#   hermes.config_yaml        - (任意) 初回のみ ~/.hermes/config.yaml に seed する内容

# Cloudflared: tunnel/credentials live in /root/.cloudflared, service reads /etc/cloudflared/config.yml
cloudflared_app_name: vaultwarden
cloudflared_hostname: "{{ vaultwarden_domain }}"
cloudflared_config_dir: /root/.cloudflared
cloudflared_user: root
cloudflared_group: root
# 既存 config.yml が warp-routing を有効にしていたので維持する
cloudflared_warp_routing_enabled: true

# Vaultwarden (zone differs from {{ domain }})
vaultwarden_domain: vault.hital.in
vaultwarden_port: "{{ host_services.melchior.vaultwarden }}"

# Hermes Agent (git install under ~/.hermes, user systemd + linger)
# コードは upstream main をこの commit にピン留め。更新は sha を書き換えて再実行するか
# melchior 上で `hermes update` を実行する（実行後はここも合わせて更新する）
hermes_commit: dbb6acd333aa4b01be551fa4edb51edc721846dd
hermes_dashboard_port: "{{ host_services.melchior.hermes_dashboard }}"
