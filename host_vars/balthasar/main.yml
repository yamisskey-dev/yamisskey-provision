---
# Balthasar - Main production server (Social & Apps)
# ansible_host should be set to actual IP or hostname in production

# Cloudflared tunnel UUID is stored in secrets.sops.yml (balthasar_cloudflared_tunnel_uuid)
cloudflared_tunnel_uuid: "{{ balthasar_cloudflared_tunnel_uuid }}"

# Service-specific configurations
modsecurity_nginx_port: "{{ host_services.balthasar.modsecurity_nginx }}"
misskey_port: "{{ host_services.balthasar.misskey }}"

# Misskey configuration (production)
misskey_host: "{{ domain }}"
misskey_tag: "2026.6.0-yami-1.9.39"

# Nginx services to deploy (user-facing app services only)
# Note: ctfd moved to Proxmox VM
modsecurity_nginx_services:
  - "misskey"
  - "synapse"
  - "element"
  - "garage"
  - "cryptpad"
  - "neo_quesdon"
